# JPA
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      # create 로 두면 애플리케이션이 뜰 때마다 테이블을 지우고 새로 만든다 —
      # 배포된 서버에서는 재시작 한 번에 사용자 데이터가 전부 사라진다.
      # 스키마를 초기화하고 싶을 때는 로컬에서만 SPRING_JPA_HIBERNATE_DDL_AUTO=create 로 덮어쓴다.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

logging.level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace
