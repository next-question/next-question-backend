name: Java CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # 테스트는 인메모리 H2 로 돌아 별도 인프라가 필요하지 않다.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  # 의존성 그래프를 GitHub 에 제출한다.
  # 이게 없으면 Dependabot 이 build.gradle 의 직접 의존성만 보고 전이 의존성은 보지 못해,
  # 취약점이 있어도 알림이 뜨지 않는다(= 알림 0건이 안전하다는 뜻이 아니게 된다).
  dependency-submission:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
